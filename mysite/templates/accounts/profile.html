{% extends "base.html" %}
{% block title %}پروفایل | رزومه{% endblock %}
{% block content %}
<section class="container profile-grid">
  <aside class="card profile-card">
    <div class="avatar-large" id="avatarPreview">
      {% if user.avatar %}<img src="{{ user.avatar.url }}" alt="تصویر پروفایل">{% else %}<span>{{ user.phone|slice:":1" }}</span>{% endif %}
    </div>
    <h2>{{ user.get_full_name|default:"بدون نام" }}</h2>
    <p class="muted ltr">{{ user.phone }}</p>
  </aside>

  <div class="card">
    <h2 class="section-title">ویرایش پروفایل</h2>
    <form method="post" enctype="multipart/form-data" class="form">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">ذخیره تغییرات</button>
    </form>
  </div>
</section>

<script>
document.getElementById('id_avatar')?.addEventListener('change', function (e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function (ev) {
    var box = document.getElementById('avatarPreview');
    box.innerHTML = '';
    var img = document.createElement('img');
    img.src = ev.target.result;
    img.alt = 'پیش‌نمایش';
    box.appendChild(img);
  };
  reader.readAsDataURL(file);
});
</script>
{% endblock %}
